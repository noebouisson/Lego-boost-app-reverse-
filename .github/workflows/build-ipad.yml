name: Build iPad app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project Blockwork.xcodeproj \
            -scheme Blockwork \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "=== errors ==="
          grep -E "error:|error :" build.log | sort -u | head -150
          echo "=== end of log ==="
          tail -n 15 build.log
          exit $status

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Blockwork.app Payload/
          zip -qry Blockwork-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blockwork-unsigned-ipa
          path: Blockwork-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
